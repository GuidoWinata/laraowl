name: laraowl

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: laraowl:${APP_VERSION:-1.1.0}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - laraowl-network
    volumes:
      - storage:/usr/share/caddy/html/storage:rw
      - public:/usr/share/caddy/html/public:rw

  horizon:
    image: laraowl:${APP_VERSION:-1.1.0}
    pull_policy: never
    restart: unless-stopped
    command: php artisan horizon
    environment:
      IS_WORKER: "true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laraowl-network
    volumes:
      - storage:/usr/share/caddy/html/storage:rw
      - public:/usr/share/caddy/html/public:rw

  schedule-worker:
    image: laraowl:${APP_VERSION:-1.1.0}
    pull_policy: never
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      IS_WORKER: "true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laraowl-network
    volumes:
      - storage:/usr/share/caddy/html/storage:rw
      - public:/usr/share/caddy/html/public:rw

  reverb:
    image: laraowl:${APP_VERSION:-1.1.0}
    pull_policy: never
    restart: unless-stopped
    command: php artisan reverb:start
    environment:
      IS_WORKER: "true"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      horizon:
        condition: service_started
    networks:
      - laraowl-network

  caddy:
    image: caddy:2-alpine
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_started
    expose:
      - "80"
    volumes:
      - ./docker/Caddyfile.dokploy:/etc/caddy/Caddyfile:ro
      - storage:/usr/share/caddy/html/storage:rw
      - public:/usr/share/caddy/html/public:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost/up"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laraowl-network